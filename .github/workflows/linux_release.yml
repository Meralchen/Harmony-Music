name: Linux Release Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Code quality check"]
    types:
      - completed
  push:
    tags:
      - 'v*'
      
jobs:
  build-linux-release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    name: Build Linux deb, rpm and optional AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            dash \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libfuse2 \
            patchelf \
            pkg-config \
            rpm \
            wget
          sudo ln -sf /bin/dash /usr/bin/sh

      - name: Configure rpmbuild wrapper for RPM 6 compatibility
        run: |
          sudo tee /usr/local/bin/rpmbuild > /dev/null << 'EOF'
          #!/usr/bin/env bash
          set -e
          for arg in "$@"; do
            if [[ "$arg" == *.spec && -f "$arg" ]]; then
              echo "==> Patching $arg for RPM 6 build directory layout..."
              sed -i 's|cp -r %{name}/\* %{buildroot}%{_datadir}/%{name}|if [ -d "%{_topdir}/BUILD/%{name}" ]; then cp -r "%{_topdir}/BUILD/%{name}"/* %{buildroot}%{_datadir}/%{name}/; elif [ -d "%{_builddir}/%{name}" ]; then cp -r "%{_builddir}/%{name}"/* %{buildroot}%{_datadir}/%{name}/; else cp -r ../%{name}/* %{buildroot}%{_datadir}/%{name}/; fi|g' "$arg"
              sed -i 's|cp -r [^ ]*\.desktop %{buildroot}%{_datadir}/applications/%{name}\.desktop|find %{_topdir}/BUILD -name "*.desktop" -exec cp {} %{buildroot}%{_datadir}/applications/%{name}.desktop \\; -quit|g' "$arg"
              sed -i 's|cp -r [^ ]*\.png %{buildroot}%{_datadir}/pixmaps/%{name}\.png|find %{_topdir}/BUILD -name "*.png" -exec cp {} %{buildroot}%{_datadir}/pixmaps/%{name}.png \\; -quit|g' "$arg"
            fi
          done
          exec /usr/bin/rpmbuild "$@"
          EOF
          sudo chmod +x /usr/local/bin/rpmbuild

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Install flutter_distributor
        run: |
          dart pub global activate flutter_distributor
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install AppImage tool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/13/obsolete-appimagetool-x86_64.AppImage -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          sudo mv /tmp/appimagetool.AppImage /usr/local/bin/appimagetool

      - name: Prepare packaging staging links
        run: |
          ln -sf build/linux/x64/release/bundle harmonymusic
          ln -sf assets/icons/icon.png harmonymusic.png

      - name: Package Debian build
        run: flutter_distributor package --platform linux --targets deb --skip-clean

      - name: Package RPM build
        run: flutter_distributor package --platform linux --targets rpm --skip-clean

      - name: Package AppImage build
        continue-on-error: true
        run: flutter_distributor package --platform linux --targets appimage --skip-clean

      - name: Upload release artifacts (All)
        uses: actions/upload-artifact@v7
        with:
          name: harmony-music-all-linux-artifacts
          path: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
          if-no-files-found: ignore

      - name: Upload release artifact (Debian-based systems)
        uses: actions/upload-artifact@v7
        with:
          name: harmony-music-deb-artifact
          path: |
            dist/**/*.deb
          if-no-files-found: ignore

      - name: Upload release artifact (Fedora-based systems)
        uses: actions/upload-artifact@v7
        with:
          name: harmony-music-rpm-artifact
          path: |
            dist/**/*.rpm
          if-no-files-found: ignore

      - name: Upload release artifact (AppImage)
        uses: actions/upload-artifact@v7
        with:
          name: harmony-music-appimage-artifact
          path: |
            dist/**/*.AppImage
          if-no-files-found: ignore
