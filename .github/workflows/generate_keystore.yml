name: Generate Android Keystore
on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key Alias'
        required: true
        default: 'harmonymusic'
      key_password:
        description: 'Keystore and Key Password'
        required: true
        default: 'HarmonyMusicPass2026'

jobs:
  generate:
    name: Generate Keystore & Base64 Secret
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        id: gen
        run: |
          ALIAS="${{ github.event.inputs.key_alias }}"
          PASSWORD="${{ github.event.inputs.key_password }}"
          
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "CN=Harmony Music, OU=Music, O=NPP-exe, L=Unknown, ST=Unknown, C=US"
          
          B64=$(base64 -w 0 upload-keystore.jks)

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          # 🎉 Android Keystore Generated Successfully!

          Save these 4 secrets in:
          **Settings** > **Secrets and variables** > **Actions** > **New repository secret**

          ---

          ### Secret 1: \`KEY_ALIAS\`
          \`\`\`text
          $ALIAS
          \`\`\`

          ### Secret 2: \`KEY_PASSWORD\`
          \`\`\`text
          $PASSWORD
          \`\`\`

          ### Secret 3: \`KEY_STORE_PASSWORD\`
          \`\`\`text
          $PASSWORD
          \`\`\`

          ### Secret 4: \`KEYSTORE_BASE64\`
          Copy the full string below:
          \`\`\`text
          $B64
          \`\`\`

          ---
          > ⚠️ **Backup:** Download the **upload-keystore** artifact below and save it to your Google Drive or backup drive for safe keeping!
          EOF

      - name: Upload Keystore Artifact (Save as backup)
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: upload-keystore.jks
